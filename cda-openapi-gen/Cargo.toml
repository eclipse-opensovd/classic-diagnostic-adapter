[package]
name = "cda-openapi-gen"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Standalone OpenAPI generator for a single ECU of the Eclipse OpenSOVD CDA"
homepage.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "cda-openapi-gen"
path = "src/main.rs"

[lib]
name = "cda_openapi_gen"
path = "src/lib.rs"

[dependencies]
opensovd_cda_lib = { workspace = true }
cda-core = { workspace = true }
cda-comm-uds = { workspace = true }
cda-database = { workspace = true }
cda-interfaces = { workspace = true }
cda-plugin-security = { workspace = true }
cda-sovd = { workspace = true }
aide = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
indexmap = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
