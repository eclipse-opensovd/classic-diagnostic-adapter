[package]
name = "cda-plugin-lock-priority"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Default lock-priority plugin for the Eclipse OpenSOVD CDA"
homepage.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
cda-interfaces = { workspace = true }

async-trait = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
