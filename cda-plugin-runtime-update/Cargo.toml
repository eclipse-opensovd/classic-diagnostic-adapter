[package]
name = "cda-plugin-runtime-update"
version = "0.1.0"
edition.workspace = true
publish = false
homepage.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
cda-database = { workspace = true }
cda-interfaces = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros", "fs"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
schemars = { workspace = true }

[dev-dependencies]
cda-database = { workspace = true, features = ["database-builder"] }
# Test-only: `MockUdsEcu` satisfies the `Uds` bound in the reloader tests.
cda-interfaces = { workspace = true, features = ["test-utils"] }
# Test-only: `LocalStorage` backs the fixtures. Production code speaks only the
# `Storage` trait, so the concrete backend is injected by the caller.
cda-storage = { workspace = true }
cda-plugin-communication-management = { workspace = true, features = ["test-utils"] }
tempfile = { workspace = true }
