[package]
name = "example-oem-routes"
version = "0.1.0"
edition.workspace = true
publish = false
description = "OEM extension point example: custom SOVD routes"
homepage.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "example-oem-routes"
path = "src/main.rs"

[dependencies]
opensovd_cda_lib = { workspace = true }
cda-interfaces = { workspace = true }
cda-plugin-security = { workspace = true }

aide = { workspace = true, features = ["axum"] }
axum = { workspace = true, features = ["json"] }
clap = { workspace = true, features = ["derive", "env"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
