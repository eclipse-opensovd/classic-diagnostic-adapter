[package]
name = "example-oem-update-policy"
version = "0.1.0"
edition.workspace = true
publish = false
description = "OEM extension point example: custom runtime-update policy and database format"
homepage.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "example-oem-update-policy"
path = "src/main.rs"

[dependencies]
opensovd_cda_lib = { workspace = true }
cda-interfaces = { workspace = true }
cda-plugin-security = { workspace = true }
cda-storage = { workspace = true }

async-trait = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
