# ECU simulator and CDA over DoIP, for trying out the CDA by hand, see
# first_steps.md. The integration tests do not use this file; they start
# their own containers with testcontainers (integration-tests/tests/util).
#
# The CDA runs with its default configuration, which serves FLXC1000,
# FLXCNG1000 and FSNR2000.

services:
  ecu-sim:
    build:
      context: ./ecu-sim
      dockerfile: docker/Dockerfile
    privileged: true
    cap_add:
      - NET_ADMIN
    environment:
      - USE_MULTIPLE_IPS=true
      - SIM_NETWORK_INTERFACE=eth0
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8181/ || exit 1"]
      interval: 1s
      timeout: 5s
      retries: 10
      start_period: 30s

  cda:
    build:
      context: ..
      dockerfile: testcontainer/cda/Dockerfile
      args:
        - SOURCE_DATE_EPOCH=0
        - SOURCE_GIT_SHA=unknown
    ports:
      - "20002:20002"
    volumes:
      - ./odx:/app/odx:ro
    depends_on:
      ecu-sim:
        condition: service_healthy
    environment:
      - RUST_LOG=info
    command: ["-d", "/app/odx"]
