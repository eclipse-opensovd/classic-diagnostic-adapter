[faults]
default_scope = "FaultMem"
user_defined_dtc_clear_service = [
    49,
    1,
    66,
    0,
]
user_memory_scope = "Development"

[flat_buf]
ignore_missing_null_terminator = false
max_apparent_size = 9223372036854775807
max_depth = 64
max_tables = 100000000
mdd_decompress = false
verify = false

[functional_description]
description_database = "functional_groups"
protocol_position = "Suffix"

[health]
enabled = true

[locks]
lock_exclusivity_policy = "exclusive_by_default"
priority_lifecycle_queue_capacity = 256
priority_lifecycle_timeout_ms = 5000
priority_policy_stale_retries = 1
priority_policy_timeout_ms = 5000

[logging]
timestamp_format = "%T%.3f"

[logging.log_file_config]
append_enabled = false
date_format = "%F %T%.3f"
enabled = false
name = "opensovd-cda.log"
path = "/var/log/opensovd-cda"

[logging.otel]
enabled = false
endpoint = "http://localhost:4317"

[runtime_update_config]
retry_after_seconds = 1
storage_dir = "."
storage_dir_load_retry_attempts = 100
storage_dir_load_retry_delay_ms = 3000
upload_body_limit_bytes = 52428800

[server]
address = "0.0.0.0"
port = 20002
transport = "tcp"

[strict]
ecu_config = false
enabled = false
parameter_validation = false
