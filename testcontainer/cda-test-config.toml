deferred_retry_after_seconds = 30
init_mode = "Always"
post_update_mode = "Enabled"
variant_detection = "Always"

[components.additional_fields]

[database]
dir = "/app/odx"
exit_no_database_loaded = true
fallback_to_base_variant = true
ignore_invalid_mdd = false
ignore_protocol = false

[database.naming_convention]
can_protocol_aliases = [
    "UDS_CAN",
    "ISO_11898_2_DWCAN",
    "ISO_11898_3_DWFTCAN",
    "CAN",
    "ISO_15765_2",
    "ISO_15765_3",
]
can_protocol_markers = [
    "CAN",
    "ISO_11898",
]
category_mapping = []
configuration_functional_classes = ["varcoding"]
configuration_service_parameter_semantic_id = "ID"
default_category = "x-sovd2uds-unmapped"
long_name_affix_position = "Suffix"
long_name_affixes = [
    " read",
    " write",
    " read dump",
    " write dump",
    " dump",
    " read func",
    " write func",
    " read dump func",
    " write dump func",
    " dump func",
    " control func",
    " control",
]
short_name_affix_position = "Suffix"
short_name_affixes = [
    "_read",
    "_write",
    "_read_dump",
    "_write_dump",
    "_dump",
    "_read_func",
    "_write_func",
    "_read_dump_func",
    "_write_dump_func",
    "_dump_func",
    "_control_func",
    "_control",
]

[database.naming_convention.action_affixes]
position = "Suffix"
read = "_Read"
request_results = "_RequestResults"
start = "_Start"
stop = "_Stop"
write = "_Write"

[database.naming_convention.semantics]
data = "DATA"
security = "SECURITY"
service_id_rq = "SERVICEIDRQ"
session = "SESSION"

[database.naming_convention.service_affixes]
133 = [
    "Prefix",
    ["DTC_Setting_Mode_"],
]
49 = [
    "Suffix",
    [
    "_start",
    "_stop",
    "_requestresults",
    "_start_func",
    "_stop_func",
    "_requestresults_func",
],
]

[doip]
alive_check_interval_secs = 1800
