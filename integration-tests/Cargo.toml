[package]
name = "integration-tests"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Integration tests for the whole Classic Diagnostic Adapter (CDA) system"
homepage.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# internal dependencies
cda-interfaces = { workspace = true }
cda-sovd = { workspace = true }
sovd-interfaces = { workspace = true }
cda-tracing = { workspace = true }
cda-health = { workspace = true }
opensovd_cda_lib = { workspace = true, features = ["integration-tests"] }

# External dependencies
# tokio
tokio = { workspace = true, features = ["rt", "sync", "io-util", "time", "signal"] }
# serde
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# http
aide = { workspace = true, features = ["axum"] }
axum = { workspace = true }
reqwest = { workspace = true, features = ["multipart"] }
http = { workspace = true }
mime = { workspace = true }
schemars = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
# error
thiserror = { workspace = true }
# toml serialization
toml = { workspace = true }
# time
chrono = { workspace = true }
# future
futures = { workspace = true }
# libc
libc = { workspace = true }
# compile time format
const_format = { workspace = true }
# temp directories for isolated tests
tempfile = { workspace = true }
# temp containers for testing
testcontainers = { workspace = true }
# enum names
strum = { workspace = true, features = ["derive"] }

[build-dependencies]
cda-build = { workspace = true }

[dev-dependencies]
cargo_metadata = { workspace = true }

[features]
# We need the health endpoint to check if the CDA is online
default = ["opensovd_cda_lib/health"]
integration-tests = []
# Variant of the integration tests that exercises the CAN transport
# (`CDA_INTEGRATION_TEST_USE_CAN=true` or `CDA_INTEGRATION_TEST_USE_MIXED=true`).
# The CDA runs in a container built with `can-socketcand`, but the harness
# validates the CAN test configuration in the test process
# (`Configuration::validate_sanity`), which rejects a `[can]` section unless
# the `can` feature is compiled in. `can-socketcand` enables it, and unlike
# `can` alone it also builds off Linux.
can-integration-tests = ["integration-tests", "opensovd_cda_lib/can-socketcand"]

# Integration tests are only compiled when the feature is enabled.
[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"
required-features = ["integration-tests"]
