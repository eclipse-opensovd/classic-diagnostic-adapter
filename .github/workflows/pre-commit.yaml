name: pre-commit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Install nightly Rust components
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-21
          components: clippy, rustfmt
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "34.1"
          # The action queries the GitHub API to fetch releases data,
          # to avoid rate limiting, passing the default token.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup DLT tracing lib
        uses: eclipse-opensovd/dlt-tracing-lib/.github/actions/setup-dlt@ebc566231f4ff6fafec78c91078e381666120f9
      - name: Run checks
        uses: eclipse-opensovd/cicd-workflows/pre-commit-action@febc566231f4ff6fafec78c91078e381666120f9
        with:
          rust-toolchain: "1.88"
      - name: Run pre-commit hooks (incl. all-features CI group)
        run: uv run --locked --group tools prek run --all-files --group CI --group @ungrouped --show-diff-on-failure
      - name: Validate commit subjects (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail=0
          for sha in $(gh api "/repos/${{ github.repository }}/pulls/${{ github.event.number }}/commits" --jq '.[].sha'); do
            git log -1 --format=%B "$sha" > /tmp/commit-msg 2>/dev/null || {
              git fetch --no-tags --depth=1 origin "$sha"
              git log -1 --format=%B "$sha" > /tmp/commit-msg
            }
            if ! uv run --locked --group tools prek run --hook-stage commit-msg \
              --commit-msg-filename /tmp/commit-msg conventional-pre-commit; then
              echo "::error::Non-conventional commit subject: $(git log -1 --format='%h %s' "$sha")"
              fail=1
            fi
          done
          exit "$fail"
