name: pre-commit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  versions:
    uses: ./.github/workflows/tool-versions.yml

  pre-commit:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Install stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ needs.versions.outputs.stable }}
          components: clippy
      - name: Install nightly Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ needs.versions.outputs.nightly }}
          components: clippy,rustfmt
      - name: Run checks
        uses: eclipse-opensovd/cicd-workflows/pre-commit-action@febc566231f4ff6fafec78c91078e381666120f9
        with:
          rust-toolchain: ${{ needs.versions.outputs.stable }}
      - name: Validate commit subjects (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail=0
          for sha in $(gh api "/repos/${{ github.repository }}/pulls/${{ github.event.number }}/commits" --jq '.[].sha'); do
            git log -1 --format=%B "$sha" > /tmp/commit-msg 2>/dev/null || {
              git fetch --no-tags --depth=1 origin "$sha"
              git log -1 --format=%B "$sha" > /tmp/commit-msg
            }
            if ! uv run --locked prek run --hook-stage commit-msg \
              --commit-msg-filename /tmp/commit-msg conventional-pre-commit; then
              echo "::error::Non-conventional commit subject: $(git log -1 --format='%h %s' "$sha")"
              fail=1
            fi
          done
          exit "$fail"
