name: Generate documentation & Requirements Tracing

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - 'gh-pages/*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

jobs:
  versions:
    uses: ./.github/workflows/tool-versions.yml

  build_documentation_and_trace_requirements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0
        with:
          submodules: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0
      - name: Build Sphinx builder docker image for generating documentation
        uses: docker/build-push-action@v5.4.0
        with:
          context: ./docs
          file: ./docs/Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository }}/sphinxdoc:latest
          load: true
          cache-from: |
            type=gha,scope=sphinx-doc-${{ github.ref_name }}
            type=gha,scope=sphinx-doc-main
          cache-to: |
            type=gha,scope=sphinx-doc-${{ github.ref_name }}
      - name: Generate documentation & verify traceability
        run: |
          docker run --rm \
            -e _JAVA_OPTIONS="-Djava.io.tmpdir=/tmp -Duser.home=/tmp" \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/docs \
            -u $(id -u):$(id -g) \
            ghcr.io/${{ github.repository }}/sphinxdoc:latest \
            bash -c "sphinx-build -W -b html . _build/html"
      - name: Upload documentation (html)
        uses: actions/upload-artifact@v7.0.2
        id: upload-docs-html
        with:
          if-no-files-found: 'error'
          name: 'cda-docs'
          retention-days: 7
          path: |
            docs/_build/html/
  build_rustdoc_security_plugin:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0
        with:
          submodules: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: ${{ needs.versions.outputs.stable }}
      - name: Clean docs folder
        run: make clean-doc
      - name: Build docs
        run: make rustdoc ARGS="--no-deps -p cda-plugin-security"
      - name: Remove lock file
        run: rm target/doc/.lock
      - name: Add redirect
        run: echo '<meta http-equiv="refresh" content="0;url=cda_plugin_security/index.html">' > target/doc/index.html
      - name: Upload documentation (rustdoc)
        uses: actions/upload-artifact@v7.0.2
        id: upload-rustdoc
        with:
          if-no-files-found: 'error'
          name: 'rustdoc'
          retention-days: 7
          path: |
            target/doc/
  deploy_to_github_pages:
    runs-on: ubuntu-latest
    needs:
      - build_documentation_and_trace_requirements
      - build_rustdoc_security_plugin
    # only run on `main` and `gh-pages` branches and do not run on forks
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/gh-pages/')) && github.event_name == 'push' && github.repository_owner == 'eclipse-opensovd'
    # Only one Pages deployment may be in progress at a time. Serialize deployments
    # across all runs; do not cancel an in-progress deployment, newer queued ones
    # replace older pending ones.
    concurrency:
      group: github-pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Sphinx documentation
        uses: actions/download-artifact@v8.0.2
        with:
          name: cda-docs
          path: pages/
      - name: Download Rustdoc documentation
        uses: actions/download-artifact@v8.0.2
        with:
          name: rustdoc
          path: pages/rustdoc/
      - name: Upload Pages artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: pages/
          name: github-pages-${{ github.run_attempt }}
      # The Actions artifact listing can lag behind a successful upload. Use the
      # same listing as deploy-pages, which otherwise fails on its first lookup.
      - name: Wait for Pages artifact visibility
        uses: actions/github-script@v7.1.0
        timeout-minutes: 4
        env:
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const resultsUrl = process.env.ACTIONS_RESULTS_URL;
            const artifactId = process.env.PAGES_ARTIFACT_ID;
            const artifactName = process.env.PAGES_ARTIFACT_NAME;
            if (!token || !resultsUrl || !artifactId || !artifactName) {
              throw new Error('Missing Actions runtime or Pages artifact information');
            }
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            const scope = claims.scp?.split(' ').find(s => s.startsWith('Actions.Results:'));
            const parts = scope?.split(':');
            if (parts?.length !== 3 || !parts[1] || !parts[2]) {
              throw new Error('Missing Actions.Results scope in runtime token');
            }
            const url = new URL('/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts', resultsUrl);
            const delays = [2, 4, 8, 16, 30, 30, 30];
            for (let attempt = 0; attempt <= delays.length; attempt++) {
              const response = await fetch(url, {
                method: 'POST',
                headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
                body: JSON.stringify({ workflowRunBackendId: parts[1], workflowJobRunBackendId: parts[2] }),
                signal: AbortSignal.timeout(10000),
              });
              if (!response.ok) {
                throw new Error(`Artifact listing failed with HTTP ${response.status}`);
              }
              const data = await response.json();
              const matches = (data.artifacts ?? []).filter(a => a.name === artifactName);
              if (matches.length > 1) {
                throw new Error(`Multiple artifacts named ${artifactName} are visible`);
              }
              if (matches.length === 1 && String(matches[0].databaseId ?? matches[0].database_id) === artifactId) {
                core.info(`Pages artifact ${artifactId} is visible`);
                return;
              }
              if (attempt === delays.length) {
                throw new Error(`Pages artifact ${artifactId} was not visible after 120 seconds`);
              }
              core.info(`Pages artifact not visible yet; retrying in ${delays[attempt]} seconds`);
              await new Promise(resolve => setTimeout(resolve, delays[attempt] * 1000));
            }
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
