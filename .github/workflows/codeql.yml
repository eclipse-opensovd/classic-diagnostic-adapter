name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  detect-native-sources:
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
    steps:
      - uses: actions/checkout@v6
      - name: Detect C/C++ sources
        id: detect
        run: |
          if [ -n "$(git ls-files -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.c++' '*.C')" ]; then
            echo 'languages=["rust","c-cpp"]' >> "$GITHUB_OUTPUT"
          else
            echo 'languages=["rust"]' >> "$GITHUB_OUTPUT"
          fi

  analyze:
    needs: detect-native-sources
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect-native-sources.outputs.languages) }}
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
