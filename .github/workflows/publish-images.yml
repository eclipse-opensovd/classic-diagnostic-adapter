# Publishes multi-architecture (linux/amd64 + linux/arm64) CDA images to GHCR.
#   - push to main -> ghcr.io/<repo>/opensovd-cda:latest (+ sha-<short>)
#   - push of tag  -> ghcr.io/<repo>/opensovd-cda:<tag>
# Each architecture is built natively on its own runner (no QEMU emulation,
# which would be prohibitively slow for Rust), pushed by digest and then
# combined into a single multi-arch manifest list.

name: Publish container images

on:
  push:
    branches:
      - main
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded branch runs are cancelled; main and tag runs always finish.
  cancel-in-progress: ${{ github.ref_type == 'branch' && github.ref_name != 'main' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}/opensovd-cda

jobs:
  versions:
    uses: ./.github/workflows/tool-versions.yml

  build:
    needs: versions
    # Never publish from forks.
    if: github.repository_owner == 'eclipse-opensovd'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      # BuildKit cache mounts (cargo registry, cargo git, sccache) are not
      # part of the type=gha layer cache, so they are kept in the Actions
      # cache and injected into / extracted from BuildKit around the build.
      # Keyed per architecture and Rust version: sccache entries are not
      # shared across targets or RUSTFLAGS. The key changes with Cargo.lock
      # and with the ISO week: within a week, pushes that keep the lock file
      # restore an exact hit and skip extraction and saving. The first push
      # of a week restores the previous entry and saves a refreshed one, so
      # the sccache entries of workspace crates are at most a week old.
      # Superseded entries are evicted by GitHub after 7 days without use.
      # Only main saves, to stay within the repository cache limit; tags and
      # other refs only restore.
      - name: Cache key
        id: mounts-key
        run: |
          prefix="cda-mounts-release-${{ matrix.arch }}-rust${{ needs.versions.outputs.stable }}"
          {
            echo "prefix=${prefix}"
            echo "lock-prefix=${prefix}-${{ hashFiles('Cargo.lock') }}-"
            echo "key=${prefix}-${{ hashFiles('Cargo.lock') }}-$(date -u +%G-W%V)"
          } >> "$GITHUB_OUTPUT"
      - name: Restore and save cache mounts (main)
        id: mounts-cache-main
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v5
        with:
          path: cache-mounts
          key: ${{ steps.mounts-key.outputs.key }}
          restore-keys: |
            ${{ steps.mounts-key.outputs.lock-prefix }}
            ${{ steps.mounts-key.outputs.prefix }}-
      - name: Restore cache mounts
        id: mounts-cache
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v5
        with:
          path: cache-mounts
          key: ${{ steps.mounts-key.outputs.key }}
          restore-keys: |
            ${{ steps.mounts-key.outputs.lock-prefix }}
            ${{ steps.mounts-key.outputs.prefix }}-
      - name: Inject cache mounts into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "cache-mounts/cargo-registry": "/usr/local/cargo/registry",
              "cache-mounts/cargo-git": "/usr/local/cargo/git",
              "cache-mounts/sccache": "/sccache"
            }
          # The post step extracts the mounts for the save step of
          # actions/cache, which only runs on main and on a key miss.
          skip-extraction: ${{ github.ref != 'refs/heads/main' || steps.mounts-cache-main.outputs.cache-hit == 'true' }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: testcontainer/cda/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            RUST_VERSION=${{ needs.versions.outputs.stable }}
            SOURCE_GIT_SHA=${{ github.sha }}
            SCCACHE_CACHE_SIZE=2G
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=cda-publish-${{ matrix.arch }}
          cache-to: |
            type=gha,mode=max,scope=cda-publish-${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: github.repository_owner == 'eclipse-opensovd'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=ref,event=tag
      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
