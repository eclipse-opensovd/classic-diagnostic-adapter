name: Duplicate Code Check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  duplication:
    name: Detect duplicate code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run jscpd
        continue-on-error: true
        run: |
          npx --yes jscpd@4 . \
            --config .jscpd.json \
            --reporters json \
            --output ../jscpd-report \
            --silent

      - name: Get changed files
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(
              github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              }
            );
            const fs = require('fs');
            fs.writeFileSync(
              'changed-files.txt',
              files.map(f => f.filename).join('\n')
            );

      - name: Analyze duplication
        run: |
          python3 .github/scripts/analyze-duplication.py \
            ../jscpd-report/jscpd-report.json \
            changed-files.txt \
            --outdir /tmp

      - name: Prepare duplicate-code comment artifact
        run: |
          mkdir -p pr-comment-duplicate-code
          echo "${{ github.event.number }}" > pr-comment-duplicate-code/pr_number
          cp /tmp/body.md pr-comment-duplicate-code/body.md

      - name: Upload duplicate-code comment artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-comment-duplicate-code
          path: pr-comment-duplicate-code/

      # Post directly for non-fork PRs (instant feedback). Fork PRs lack write
      # permissions and are handled by the workflow_run workflow in pr-comment.yml.
      - name: Post PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/body.md', 'utf8');
            const marker = '<!-- duplicate-code-check -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Create check run
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = fs.readFileSync('/tmp/check-title.txt', 'utf8').trim();
            const summary = fs.readFileSync('/tmp/check-summary.txt', 'utf8').trim();
            const conclusion = fs.readFileSync('/tmp/check-conclusion.txt', 'utf8').trim();

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Duplicate Code Check',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion,
              output: { title, summary },
            });
