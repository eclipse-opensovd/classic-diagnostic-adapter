name: PR Lint and Format Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  versions:
    uses: ./.github/workflows/tool-versions.yml

  format_and_clippy_for_pr:
    needs: versions
    runs-on: ubuntu-latest
    name: "PR Lint and Format"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Setup DLT tracing lib
        uses: eclipse-opensovd/dlt-tracing-lib/.github/actions/setup-dlt@main
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ needs.versions.outputs.protoc }}
          # The action queries the GitHub API to fetch releases data,
          # to avoid rate limiting, passing the default token.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Format and Clippy - Nightly toolchain pinned
        uses: eclipse-opensovd/cicd-workflows/rust-lint-and-format-action@febc566231f4ff6fafec78c91078e381666120f9
        with:
          toolchain: ${{ needs.versions.outputs.nightly }}
          extra-args: "--all-features --all-targets"
