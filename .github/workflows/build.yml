name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  # pull-requests: write is required by the coverage job to post PR comments.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  versions:
    uses: ./.github/workflows/tool-versions.yml

  features:
    needs: versions
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--cfg tokio_unstable -L /usr/local/lib"
      PKG_CONFIG_PATH: "/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ needs.versions.outputs.stable }}
          components: clippy,rustfmt
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ needs.versions.outputs.protoc }}
          # The action queries the GitHub API to fetch releases data,
          # to avoid rate limiting, passing the default token.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup DLT tracing lib
        uses: eclipse-opensovd/dlt-tracing-lib/.github/actions/setup-dlt@main
      - name: Build all features
        run: make build-all-features
      - name: Verify generated files are up to date
        run: |
          if ! git diff --exit-code cda-database/src/flatbuf/diagnostic_description.rs cda-database/src/proto/fileformat.rs; then
            echo ""
            echo "::error::Generated files are out of date."
            echo "Regenerate flatbuffers with: make generate-flatbuffers"
            echo "Regenerate protos with: make generate-protos"
            exit 1
          fi
          echo "Generated files are up to date."
      - name: Verify reference config matches generated config
        run: |
          make generate-config OUTPUT=/tmp/opensovd-cda.toml
          if ! diff -u opensovd-cda.toml /tmp/opensovd-cda.toml; then
            echo ""
            echo "::error::opensovd-cda.toml does not match configuration generated from code."

            cat <<EOF
          The opensovd-cda.toml file is a reference generated from the source code.
          You should not edit it directly and it needs to be regenerated when you
          edit the configuration fields in the source code.

          You can regenerate it with:
          make generate-config

          You will need DLT installed as a library on your system.
          You can install it like so:
            * On Debian-based systems: apt install libdlt-dev
            * On macOS with Homebrew:
              brew tap COVESA/dlt-daemon https://github.com/COVESA/dlt-daemon
              brew install COVESA/dlt-daemon/dlt-daemon
          EOF
            exit 1
          fi
          echo "opensovd-cda.toml is up to date."
      # note: if openssl and mbedtls are enabled falls back to openssl
      # therefore we build mbedtls separately as well
      - name: Build mbedtls features
        run: make build-mbedtls
      - name: Build minimal features
        run: make build-minimal
      - name: Build minimal CDA only
        # Building CDA only makes sure that optional dependencies
        # from within the workspace are properly marked as optional and guarded
        # with cfg flags.
        run: make build-minimal-cda

  build_and_test:
    needs: versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ needs.versions.outputs.stable }}
          components: clippy, rustfmt, llvm-tools
      - name: Install cargo-deny
        run: cargo install --locked --version "${{ needs.versions.outputs.cargo_deny }}" cargo-deny
      - name: Install cargo-llvm-cov
        run: cargo install --locked --version "${{ needs.versions.outputs.cargo_llvm_cov }}" cargo-llvm-cov
      - name: Build
        run: make build
      - name: Check licenses
        run: make deny ARGS=licenses
      - name: Check allowed sources
        run: make deny ARGS=sources
      - name: Check banned practises
        run: make deny ARGS=bans
      - name: Run unit tests with coverage
        run: make coverage
      - name: Upload unit test coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov-unit
          path: lcov.info
          retention-days: 30

  integration_images:
    name: Integration test images
    needs: versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ needs.versions.outputs.stable }}
      # Compiled here instead of in the Dockerfile, so that the Rust cache of
      # this job restores the previous target directory: after a Cargo.lock
      # change only the changed crates are compiled again, where the Docker
      # layer cache reuses all dependencies or none. The flags are those of
      # the Dockerfile: CHECK_RUSTFLAGS, plus coverage.
      - name: Build CDA binary (can-socketcand, coverage-enabled)
        env:
          RUSTFLAGS: -C debug-assertions -C overflow-checks=on -C instrument-coverage
        run: |
          cargo build --release --bin opensovd-cda --features can-socketcand
          mkdir -p "$RUNNER_TEMP/cda-prebuilt"
          cp target/release/opensovd-cda "$RUNNER_TEMP/cda-prebuilt/"
      # Built once for all modes; the tests start their containers from them
      # (the *_TEST_IMAGE_NAME/_TAG variables). One CDA image, with the
      # `can-socketcand` transport and coverage-instrumented, serves every
      # mode, like a local test build.
      - name: Build CDA docker image (can-socketcand, coverage-enabled)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: testcontainer/cda/Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository }}/opensovd-cda:coverage
          load: true
          build-args: |
            CDA_BINARY_SOURCE=prebuilt
          build-contexts: |
            cda-prebuilt=${{ runner.temp }}/cda-prebuilt
          cache-from: |
            type=gha,scope=cda-runtime-${{ github.ref_name }}
            type=gha,scope=cda-runtime-main
          cache-to: |
            type=gha,mode=max,scope=cda-runtime-${{ github.ref_name }}
      - name: Build ECU Sim docker image
        uses: docker/build-push-action@v5
        with:
          context: testcontainer/ecu-sim/
          file: testcontainer/ecu-sim/docker/Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository }}/ecu-sim:latest
          load: true
          cache-from: |
            type=gha,scope=ecu-sim-gradle-${{ github.ref_name }}
            type=gha,scope=ecu-sim-gradle-main
          cache-to: |
            type=gha,mode=max,scope=ecu-sim-gradle-${{ github.ref_name }}
      - name: Build socketcand docker image
        uses: docker/build-push-action@v5
        with:
          context: testcontainer/socketcand/
          file: testcontainer/socketcand/Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository }}/socketcand:latest
          load: true
          cache-from: |
            type=gha,scope=socketcand-${{ github.ref_name }}
            type=gha,scope=socketcand-main
          cache-to: |
            type=gha,mode=max,scope=socketcand-${{ github.ref_name }}
      - name: Save integration test images
        run: |
          docker save --output "$RUNNER_TEMP/integration-images.tar" \
            "ghcr.io/${{ github.repository }}/opensovd-cda:coverage" \
            "ghcr.io/${{ github.repository }}/ecu-sim:latest" \
            "ghcr.io/${{ github.repository }}/socketcand:latest"
      - name: Upload integration test images
        uses: actions/upload-artifact@v7
        with:
          name: integration-images
          path: ${{ runner.temp }}/integration-images.tar
          retention-days: 1
          compression-level: 1

  integration_tests:
    name: ${{ matrix.name }} integration tests
    needs: [versions, integration_images]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: doip
            name: DoIP
            make_target: integration-test
          - mode: can
            name: CAN
            make_target: integration-test-can
          # DoIP and CAN at the same time: TMCC3000/HOVR4000/JGWT5000 are
          # pinned to CAN, FLXC1000 to DoIP, the remaining ECUs bind to the
          # transport that detects them first. The only mode that exercises
          # MultiTransportGateway routing with both gateways alive, and it
          # runs the session/security tests the can mode skips.
          - mode: mixed
            name: Mixed DoIP+CAN
            make_target: integration-test-mixed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ needs.versions.outputs.stable }}
          components: clippy, rustfmt, llvm-tools
      # The vcan kernel module backs the vcan0 bus each socketcand container
      # creates in its own network namespace.
      - name: Load vcan kernel module
        if: matrix.mode != 'doip'
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo modprobe vcan
      - name: Download integration test images
        uses: actions/download-artifact@v7
        with:
          name: integration-images
          path: ${{ runner.temp }}
      - name: Load integration test images
        run: docker load --input "$RUNNER_TEMP/integration-images.tar"
      # Unit tests gated on the can features (e.g. the CAN example config
      # validity test) run nowhere else: build_and_test uses default features
      # and the clippy workflow does not execute tests.
      - name: Install cargo-llvm-cov
        if: matrix.mode == 'can'
        run: cargo install --locked --version "${{ needs.versions.outputs.cargo_llvm_cov }}" cargo-llvm-cov
      - name: Run unit tests with coverage (CAN features)
        if: matrix.mode == 'can'
        run: make coverage-can
      - name: Run ${{ matrix.name }} integration tests
        env:
          CDA_INTEGRATION_TEST_COVERAGE: "true"
          CDA_TEST_IMAGE_NAME: ghcr.io/${{ github.repository }}/opensovd-cda
          CDA_TEST_IMAGE_TAG: coverage
          ECU_SIM_TEST_IMAGE_NAME: ghcr.io/${{ github.repository }}/ecu-sim
          ECU_SIM_TEST_IMAGE_TAG: latest
          SOCKETCAND_TEST_IMAGE_NAME: ghcr.io/${{ github.repository }}/socketcand
          SOCKETCAND_TEST_IMAGE_TAG: latest
        run: make ${{ matrix.make_target }}
      - name: Install lcov
        if: matrix.mode == 'can'
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: Process Docker coverage
        uses: ./.github/actions/process-docker-coverage
        with:
          output-file: lcov-${{ matrix.mode }}-docker.info
      - name: Merge ${{ matrix.name }} coverage data
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -x
          # Union with the host unit-test coverage (CAN features), which only
          # the can mode collects.
          if [ -s "lcov-$MODE-docker.info" ] && [ -s "lcov-$MODE-unit.info" ]; then
            lcov --add-tracefile "lcov-$MODE-docker.info" --add-tracefile "lcov-$MODE-unit.info" \
              --output-file "lcov-$MODE.info" --ignore-errors inconsistent
          elif [ -s "lcov-$MODE-unit.info" ]; then
            cp "lcov-$MODE-unit.info" "lcov-$MODE.info"
          else
            cp "lcov-$MODE-docker.info" "lcov-$MODE.info"
          fi
      - name: Upload ${{ matrix.name }} coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov-${{ matrix.mode }}
          path: lcov-${{ matrix.mode }}.info
          retention-days: 30

  merge_coverage:
    name: Merge coverage
    runs-on: ubuntu-latest
    needs: [build_and_test, integration_tests]
    steps:
      - name: Download per-suite coverage artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-lcov-*
          merge-multiple: true
      - name: Merge coverage data
        run: |
          set -x
          sudo apt-get update && sudo apt-get install -y lcov
          ADD_ARGS=""
          for f in lcov.info lcov-doip.info lcov-can.info lcov-mixed.info; do
            if [ -s "$f" ]; then
              ADD_ARGS="$ADD_ARGS --add-tracefile $f"
            fi
          done
          lcov $ADD_ARGS --output-file lcov-merged.info --ignore-errors inconsistent
          SUMMARY=$(lcov --summary lcov-merged.info 2>&1 || true)
          echo "$SUMMARY"
          TOTAL_COV=$(echo "$SUMMARY" | grep -oP 'lines\.*:\s*\K[0-9.]+' || echo "0")
          echo "**Total line coverage: ${TOTAL_COV}%**" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload merged coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov-merged.info
          retention-days: 30
      - name: Generate coverage PR comment artifact
        if: github.event_name == 'pull_request'
        run: |
          TOTAL_COV=$(lcov --summary lcov-merged.info 2>&1 | grep -oP 'lines\.*:\s*\K[0-9.]+' || echo "0")
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SYMBOL="$(printf '\xf0\x9f\x93\x8a')"
          mkdir -p pr-comment-coverage
          echo "${{ github.event.number }}" > pr-comment-coverage/pr_number
          printf '%s\n' \
            '<!-- coverage-report -->' \
            "### ${SYMBOL} Coverage Report (unit + DoIP/CAN/mixed integration)" \
            '' \
            "**Total line coverage: ${TOTAL_COV}%**" \
            '' \
            "[Full build artifacts](${RUN_URL})" \
            > pr-comment-coverage/body.md
      - name: Upload coverage PR comment artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pr-comment-coverage
          path: pr-comment-coverage/

  cargo-crap:
    name: CRAP (Change Risk Anti-Patterns)
    if: github.event_name == 'pull_request'
    needs: [merge_coverage, versions]
    uses: eclipse-opensovd/cicd-workflows/.github/workflows/crap.yml@febc566231f4ff6fafec78c91078e381666120f9
    with:
      rust-version: ${{ needs.versions.outputs.stable }}
      cargo-crap-git-url: "https://github.com/theswiftfox/cargo-crap.git"
      cargo-crap-git-rev: "27bab7d86c0ff9c4f8f681d6538be24572ca1a8d"
      lcov-file: "lcov-merged.info"
      post-pr-comment: true
      fail-regressions: false
    permissions:
      contents: read
      pull-requests: write

  build_windows:
    needs: versions
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ needs.versions.outputs.stable }}
          components: clippy, rustfmt, llvm-tools
      - name: Install GNU Make
        run: choco install make --no-progress -y
      - name: Setup OpenSSL (Windows) Environment
        run: |
          echo "OPENSSL_DIR=$env:OPENSSL_DIR" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$env:OPENSSL_DIR\lib\VC\$env:RUNNER_ARCH\MD" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$env:OPENSSL_DIR\include" >> $env:GITHUB_ENV
        env:
          OPENSSL_DIR: C:\Program Files\OpenSSL
      - name: Build
        run: make build
      - name: Test
        run: make test ARGS="-- --show-output"
