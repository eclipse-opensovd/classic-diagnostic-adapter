# GitHub Actions are not updated here: they are pinned in .github/workflows/actions.lock,
# which Dependabot cannot regenerate (`make actions-update-lockfile`).

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, rust]
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directories: [/, /docs]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, 'python:uv']
    groups:
      python:
        patterns: ["*"]
